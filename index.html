<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<title>Nuaim Ahmed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
  --bg:light-dark(#f4f4f2,#0b0b0c);
  --card:light-dark(#ffffff,#161617);
  --ink:light-dark(#111112,#f1f1ef);
  --mute:light-dark(#8a8a86,#8e8e8a);
  --line:light-dark(#ebebe7,#232325);
  --tile:light-dark(#f6f6f4,#1f1f21);
  --ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
main{max-width:420px;margin:0 auto;padding:clamp(24px,6vw,52px) 16px 40px}

/* hero: three stacked cards, same size, cross-fade */
.hero{position:relative;height:296px;border-radius:28px;overflow:hidden;background:#111112;animation:rise .8s var(--ease) both}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:24px;text-align:center;color:#fff;opacity:0;transform:scale(1.04);transition:opacity .55s var(--ease),transform .7s var(--ease);pointer-events:none}
.face.on{opacity:1;transform:none;pointer-events:auto}
.face[data-g=personal]{background:#111112}
.face[data-g=work]{background:#0b1d35}
.face[data-g=business]{background:#1c1c1e}
.mark{height:100px;display:grid;place-items:center;margin-bottom:20px}
.mono{width:84px;height:84px;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);display:grid;place-items:center;font-weight:700;font-size:26px;letter-spacing:1px}
.mark img{display:block}
.mark .ep{width:190px}
.mark .bn{width:158px}
.face h1{margin:0;font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.3px}
.face p{margin:6px 0 0;font-size:14.5px;color:rgba(255,255,255,.62)}
.face.on .mark,.face.on h1,.face.on p{animation:up .6s var(--ease) both}
.face.on h1{animation-delay:.06s}.face.on p{animation-delay:.12s}

/* tabs with sliding pill */
.tabs{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin:16px 0}
.pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:12px;background:var(--ink);transition:transform .45s var(--ease)}
.tabs button{position:relative;z-index:1;min-height:42px;border:0;background:none;color:var(--mute);font:600 14.5px Manrope,system-ui,sans-serif;cursor:pointer;transition:color .3s}
.tabs button[aria-selected=true]{color:var(--bg)}
.tabs button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;border-radius:12px}

/* links: fixed height so every tab is the same size */
.list{display:flex;flex-direction:column;gap:8px;min-height:calc(4*68px + 3*8px)}
.row{display:flex;align-items:center;gap:14px;height:68px;padding:0 8px 0 12px;background:var(--card);border:1px solid var(--line);border-radius:18px;animation:up .5s var(--ease) both;transition:transform .2s var(--ease),border-color .2s}
.row:hover{transform:translateY(-2px);border-color:light-dark(#d9d9d4,#333336)}
.row:active{transform:scale(.985)}
.ic{flex:none;width:44px;height:44px;border-radius:13px;background:var(--tile);display:grid;place-items:center}
.ic svg{width:24px;height:24px;display:block}
.ic.call{background:#34c759}.ic.call svg{width:21px;height:21px}
.txt{flex:1;display:block;text-decoration:none;color:inherit;padding:10px 0}
.txt b{display:block;font-weight:600;font-size:15.5px;line-height:1.3}
.txt span{display:block;color:var(--mute);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:none;color:var(--mute);cursor:pointer;display:grid;place-items:center}
.cp:hover{background:var(--tile);color:var(--ink)}
.cp svg{width:17px;height:17px}
.cp:focus-visible,.txt:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:10px}
.cp.ok{color:#34c759}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13.5px;font-weight:600;opacity:0;transition:.3s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <section class="hero" aria-live="polite">
    <div class="face" data-g="personal">
      <div class="mark"><div class="mono">NA</div></div>
      <h1>Nuaim Ahmed</h1>
      <p>Process &amp; Proposal Engineer<br>Co-founder, byNode</p>
    </div>
    <div class="face" data-g="business">
      <div class="mark"><img class="bn" src="bynode.svg" alt="byNode"></div>
      <h1>Nuaim Ahmed</h1>
      <p>Co-founder</p>
    </div>
    <div class="face" data-g="work">
      <div class="mark"><img class="ep" src="epcm.svg" alt="EPCM Holdings"></div>
      <h1>Nuaim Ahmed</h1>
      <p>Process &amp; Proposal Engineer</p>
    </div>
  </section>

  <div class="tabs" role="tablist" aria-label="Contact sections">
    <span class="pill" id="pill"></span>
    <button role="tab" id="tab-personal" data-g="personal" aria-selected="true">Personal</button>
    <button role="tab" id="tab-business" data-g="business" aria-selected="false">byNode</button>
    <button role="tab" id="tab-work" data-g="work" aria-selected="false">Work</button>
  </div>

  <div class="list" id="list" role="tabpanel"></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const list=document.getElementById('list'),pill=document.getElementById('pill');

  if(!G[g])g='personal';
  if(g===cur)return;cur=g;
  tabs.forEach(b=>b.setAttribute('aria-selected',b.dataset.g===g));
  faces.forEach(f=>f.classList.toggle('on',f.dataset.g===g));

  list.innerHTML=G[g].map((r,i)=>row(r,i,g)).join('');
  list.setAttribute('aria-labelledby','tab-'+g);
};

show(location.hash.slice(1));
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));

const t=document.getElementById('toast');let tm;

  try{await navigator.clipboard.writeText(b.dataset.v);t.textContent='Copied'}catch(_){t.textContent=b.dataset.v}
  b.innerHTML=TICK;b.classList.add('ok');setTimeout(()=>{b.innerHTML=COPY;b.classList.remove('ok')},1400);

});
